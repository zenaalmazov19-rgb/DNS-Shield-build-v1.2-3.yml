name: DNS Shield APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Создать Android-проект
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/example/dnsshield
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DNS-Shield"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.dnsshield"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.dnsshield"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.2"
              }

              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file("dns-shield.keystore")
                      storePassword = "dnsShield123"
                      keyAlias = "dns-shield"
                      keyPassword = "dnsShield123"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="DNS Shield"
                  android:icon="@drawable/ic_shield"
                  android:roundIcon="@drawable/ic_shield"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#07130D</item>
                  <item name="android:navigationBarColor">#07130D</item>
                  <item name="android:colorAccent">#55E68A</item>
                  <item name="android:windowBackground">#07130D</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_shield.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#55E68A"
                  android:pathData="M54,7 L92,22 L92,51 C92,75 76,94 54,101 C32,94 16,75 16,51 L16,22 Z" />
              <path
                  android:fillColor="#07130D"
                  android:pathData="M54,20 L79,30 L79,51 C79,67 69,81 54,87 C39,81 29,67 29,51 L29,30 Z" />
              <path
                  android:fillColor="#55E68A"
                  android:pathData="M48,65 L36,53 L42,47 L48,53 L66,35 L72,41 Z" />
          </vector>
          EOF

          cat > app/src/main/java/com/example/dnsshield/MainActivity.kt <<'EOF'
          package com.example.dnsshield

          import android.app.Activity
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private val green = Color.rgb(85, 230, 138)
              private val bg = Color.rgb(7, 19, 13)
              private val card = Color.rgb(17, 32, 23)
              private val text = Color.rgb(242, 247, 244)
              private val muted = Color.rgb(166, 184, 173)

              private val providers = listOf(
                  "AdGuard DNS" to "dns.adguard-dns.com",
                  "AdGuard Family" to "family.adguard-dns.com",
                  "Cloudflare Malware" to "security.cloudflare-dns.com"
              )

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.rgb(4, 12, 8)
                  window.navigationBarColor = Color.rgb(4, 12, 8)

                  val scroll = ScrollView(this)
                  scroll.setBackgroundColor(bg)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(28, 28, 28, 32)
                  scroll.addView(root)

                  val title = tv("DNS Shield", 30f, text, true)
                  root.addView(title, lp())

                  val subtitle = tv("Защита DNS без запуска VPN", 16f, green, false)
                  subtitle.setPadding(0, 6, 0, 24)
                  root.addView(subtitle, lp())

                  val info = cardView(
                      "ВАЖНО",
                      "DNS Shield не запускает VpnService и не отключает ваш основной VPN. " +
                          "Приложение помогает выбрать DNS-блоклист и открыть системные настройки Private DNS."
                  )
                  root.addView(info, lp(0, 0, 0, 18))

                  val section = tv("DNS-блоклист", 21f, text, true)
                  root.addView(section, lp(0, 0, 0, 10))

                  var selected = 0
                  val cards = mutableListOf<TextView>()

                  providers.forEachIndexed { index, pair ->
                      val item = TextView(this)
                      item.text = "●  ${pair.first}\\n    ${pair.second}"
                      item.textSize = 16f
                      item.setTextColor(if (index == 0) green else text)
                      item.setTypeface(null, Typeface.BOLD)
                      item.setPadding(20, 18, 20, 18)
                      item.setBackgroundColor(card)
                      item.setOnClickListener {
                          selected = index
                          cards.forEachIndexed { i, v ->
                              v.setTextColor(if (i == selected) green else text)
                          }
                      }
                      cards.add(item)
                      root.addView(item, lp(0, 0, 0, 10))
                  }

                  val open = button("Открыть настройки Private DNS", true)
                  open.setOnClickListener {
                      runCatching {
                          startActivity(Intent("android.settings.PRIVATE_DNS_SETTINGS"))
                      }.getOrElse {
                          startActivity(Intent(Settings.ACTION_SETTINGS))
                      }
                  }
                  root.addView(open, lp(0, 8, 0, 10))

                  val copy = button("Скопировать выбранный DNS", false)
                  copy.setOnClickListener {
                      val host = providers[selected].second
                      val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      clipboard.setPrimaryClip(ClipData.newPlainText("Private DNS", host))
                      Toast.makeText(this, "Скопировано: $host", Toast.LENGTH_SHORT).show()
                  }
                  root.addView(copy, lp(0, 0, 0, 22))

                  root.addView(tv("Как включить", 21f, text, true), lp(0, 0, 0, 8))
                  root.addView(tv(
                      "1. Нажмите «Открыть настройки Private DNS».\\n" +
                      "2. Выберите «Имя хоста провайдера Private DNS».\\n" +
                      "3. Введите выбранный hostname.\\n" +
                      "4. Сохраните настройку.\\n\\n" +
                      "Если ваш основной VPN перехватывает DNS-запросы, Private DNS может не применяться. " +
                      "В таком случае DNS-блокировку нужно включить в настройках самого VPN.",
                      15f, muted, false
                  ), lp())

                  setContentView(scroll)
              }

              private fun tv(s: String, size: Float, color: Int, bold: Boolean): TextView {
                  return TextView(this).apply {
                      text = s
                      textSize = size
                      setTextColor(color)
                      if (bold) setTypeface(null, Typeface.BOLD)
                  }
              }

              private fun cardView(title: String, body: String): LinearLayout {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(20, 18, 20, 18)
                  box.setBackgroundColor(card)
                  box.addView(tv(title, 14f, green, true), lp(0, 0, 0, 6))
                  box.addView(tv(body, 14f, muted, false), lp())
                  return box
              }

              private fun button(label: String, primary: Boolean): Button {
                  return Button(this).apply {
                      text = label
                      textSize = 15f
                      isAllCaps = false
                      setTextColor(if (primary) Color.rgb(4, 20, 10) else green)
                      setBackgroundColor(if (primary) green else card)
                      minHeight = 54
                  }
              }

              private fun lp(l: Int = 0, t: Int = 0, r: Int = 0, b: Int = 0): LinearLayout.LayoutParams {
                  return LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ).apply {
                      setMargins(l, t, r, b)
                  }
              }
          }
          EOF

      - name: Создать ключ подписи
        shell: bash
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore dns-shield.keystore \
            -storepass dnsShield123 \
            -alias dns-shield \
            -keypass dnsShield123 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=DNS Shield, OU=Mobile, O=DNS Shield, L=Mobile, ST=Mobile, C=US"

      - name: Скачать Gradle
        shell: bash
        run: |
          set -e
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Собрать Release APK
        shell: bash
        run: |
          set -e
          gradle --version
          gradle clean assembleRelease --no-daemon --stacktrace

      - name: Проверить APK
        shell: bash
        run: |
          set -e
          test -f app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: DNS-Shield-v1.2
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
