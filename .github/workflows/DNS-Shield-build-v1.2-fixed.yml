name: DNS Shield APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Проверить Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME"
          SDKMANAGER=""
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "sdkmanager не найден, но продолжаем: GitHub runner обычно уже содержит нужные Android SDK."
          fi

          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools" || true
          fi

      - name: Создать ключ подписи
        shell: bash
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore dns-shield.keystore \
            -storepass dnsShield123 \
            -alias dns-shield \
            -keypass dnsShield123 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=DNS Shield, OU=Mobile, O=DNS Shield, L=Chicago, ST=Illinois, C=US"

      - name: Подготовить Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Собрать Release APK
        shell: bash
        run: |
          set -e
          gradle --stop || true
          gradle clean assembleRelease --no-daemon --stacktrace

      - name: Проверить APK
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"
          echo "APK готов: $APK"

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: DNS-Shield-v1.2
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
