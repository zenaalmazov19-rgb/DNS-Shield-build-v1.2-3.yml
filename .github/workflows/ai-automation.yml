name: DNS Shield AI Assistant

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Что нужно сделать"
        required: true
        type: choice
        options:
          - code_task
          - build_error
      task:
        description: "Задание для ИИ или описание ошибки"
        required: true
        type: string

permissions:
  contents: read

jobs:
  ai-assistant:
    runs-on: ubuntu-latest
    steps:
      - name: Analyze request with OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.CHATGPT_API_KEY }}
          MODE: ${{ inputs.mode }}
          TASK: ${{ inputs.task }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "GitHub Secret CHATGPT_API_KEY is missing." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [[ "$MODE" == "build_error" ]]; then
            INSTRUCTION="Analyze this Android GitHub Actions build error. Explain the likely cause and propose a safe fix. Do not claim to have changed files."
          else
            INSTRUCTION="Analyze this DNS Shield Android code task. Propose a minimal patch as a unified diff and explain the changes. Do not claim to have changed files."
          fi
          export INSTRUCTION

          python3 - <<'PY'
          import json, os
          payload = {
              "model": "gpt-4.1-mini",
              "messages": [
                  {"role": "system", "content": os.environ["INSTRUCTION"]},
                  {"role": "user", "content": os.environ["TASK"]}
              ]
          }
          with open("request.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          PY

          if ! curl --fail --silent --show-error \
            https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            --data @request.json \
            -o response.json; then
            echo "OpenAI API request failed. Check the API key, account billing, and API access." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          python3 - <<'PY'
          import json, os, sys
          with open("response.json", encoding="utf-8") as f:
              data = json.load(f)
          if "error" in data:
              message = data["error"].get("message", "Unknown API error")
              answer = "OpenAI API error: " + message
              status = 1
          else:
              choices = data.get("choices", [])
              answer = choices[0].get("message", {}).get("content", "No answer returned.") if choices else "The API returned no choices."
              status = 0
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("# DNS Shield AI Assistant\n\n")
              f.write(answer + "\n")
          if status:
              sys.exit(status)
          PY
