name: DNS Shield APK v2.2 RELEASE — corrected signed build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      # Reuse the exact project-generation step from the already working v2.2 workflow.
      # Do not patch MainActivity.java here; that was the source of the previous compile failures.
      - name: Создать проверенный проект DNS Shield 2.2
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          workflow = Path(".github/workflows/DNS-Shield-v2.2.yml")
          if not workflow.exists():
              raise SystemExit("Не найден .github/workflows/DNS-Shield-v2.2.yml")

          data = yaml.safe_load(workflow.read_text(encoding="utf-8"))
          steps = data["jobs"]["build"]["steps"]
          source_step = next(
              (step for step in steps if step.get("name") == "Создать проект на основе v1.4"),
              None,
          )
          if not source_step or not source_step.get("run"):
              raise SystemExit("Не найден шаг создания проверенного проекта в v2.2")

          Path("/tmp/create_dns_shield.sh").write_text(source_step["run"], encoding="utf-8")
          print("Шаг создания проекта v2.2 найден.")
          PY
          bash /tmp/create_dns_shield.sh

      - name: Настроить версию и подпись Release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("project/app/build.gradle.kts")
          s = gradle.read_text(encoding="utf-8")
          # Do not depend on exact version-string formatting; preserve the version
          # produced by the already-tested v2.2 project-generation step.
          if "versionName" not in s or "versionCode" not in s:
              raise SystemExit("В Gradle-файле не найдены поля versionName/versionCode.")
          if "signingConfigs {" in s:
              raise SystemExit("В Gradle уже есть signingConfigs; остановка без изменений.")
          if "buildTypes {" not in s:
              raise SystemExit("Не найден блок buildTypes в Gradle-файле.")

          signing = '''    signingConfigs {
              create("release") {
                  storeFile = file("../dns-shield-release.jks")
                  storePassword = System.getenv("DNS_STORE_PASSWORD")
                      ?: error("Не задан DNS_STORE_PASSWORD")
                  keyAlias = "dns-shield"
                  keyPassword = System.getenv("DNS_KEY_PASSWORD")
                      ?: error("Не задан DNS_KEY_PASSWORD")
              }
          }

          '''
          s = s.replace("    buildTypes {", signing + "    buildTypes {", 1)

          release_marker = "        release {"
          if release_marker not in s:
              raise SystemExit("Не найден release-блок в buildTypes.")
          s = s.replace(
              release_marker,
              release_marker + '\n            signingConfig = signingConfigs.getByName("release")',
              1,
          )
          gradle.write_text(s, encoding="utf-8")
          print("Release-подпись настроена; Java-код не менялся.")
          PY

      - name: Проверить секреты подписи
        shell: bash
        env:
          DNS_RELEASE_KEY_BASE64: ${{ secrets.DNS_RELEASE_KEY_BASE64 }}
          DNS_STORE_PASSWORD: ${{ secrets.DNS_STORE_PASSWORD }}
          DNS_KEY_PASSWORD: ${{ secrets.DNS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DNS_RELEASE_KEY_BASE64" || { echo "Не задан секрет DNS_RELEASE_KEY_BASE64"; exit 1; }
          test -n "$DNS_STORE_PASSWORD" || { echo "Не задан секрет DNS_STORE_PASSWORD"; exit 1; }
          test -n "$DNS_KEY_PASSWORD" || { echo "Не задан секрет DNS_KEY_PASSWORD"; exit 1; }
          echo "Все три секрета подписи заданы."

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Восстановить и проверить постоянный ключ подписи
        shell: bash
        env:
          DNS_RELEASE_KEY_BASE64: ${{ secrets.DNS_RELEASE_KEY_BASE64 }}
          DNS_STORE_PASSWORD: ${{ secrets.DNS_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$DNS_RELEASE_KEY_BASE64" | base64 --decode > project/dns-shield-release.jks
          chmod 600 project/dns-shield-release.jks
          keytool -list -keystore project/dns-shield-release.jks \
            -storepass "$DNS_STORE_PASSWORD" -alias dns-shield >/dev/null
          echo "Постоянный ключ подписи восстановлен и проверен."

      - name: Проверить Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          fi

      - name: Установить Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Собрать подписанный Release APK
        working-directory: project
        shell: bash
        env:
          DNS_STORE_PASSWORD: ${{ secrets.DNS_STORE_PASSWORD }}
          DNS_KEY_PASSWORD: ${{ secrets.DNS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle clean assembleRelease --no-daemon --stacktrace

      - name: Проверить подпись APK
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "Подпись Release APK проверена."

      - name: Подготовить APK
        shell: bash
        run: |
          set -euo pipefail
          cp project/app/build/outputs/apk/release/app-release.apk DNS-Shield-v2.2-release.apk
          ls -lh DNS-Shield-v2.2-release.apk

      - name: Загрузить Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DNS-Shield-v2.2-release
          path: DNS-Shield-v2.2-release.apk
          if-no-files-found: error
