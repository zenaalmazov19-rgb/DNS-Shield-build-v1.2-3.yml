name: DNS Shield — создать постоянный ключ подписи

on:
  workflow_dispatch:

jobs:
  create-signing-key:
    runs-on: ubuntu-latest

    steps:
      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Проверить секреты
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.DNS_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DNS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STORE_PASSWORD" || { echo "Не задан DNS_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Не задан DNS_KEY_PASSWORD"; exit 1; }

      - name: Создать JKS
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.DNS_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DNS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore dns-shield-release.jks \
            -storetype JKS \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias dns-shield \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=DNS Shield, OU=DNS Shield, O=DNS Shield, C=US"

          base64 -w 0 dns-shield-release.jks > dns-shield-release.jks.base64

          keytool -list -v \
            -keystore dns-shield-release.jks \
            -storepass "$STORE_PASSWORD" \
            -alias dns-shield \
            | grep -E 'Alias name:|Valid from:|SHA256:' > signing-fingerprint.txt

          echo "Ключ создан. Пароли в лог не выводятся."

      - name: Загрузить ключ для сохранения
        uses: actions/upload-artifact@v4
        with:
          name: DNS-Shield-signing-key
          path: |
            dns-shield-release.jks.base64
            signing-fingerprint.txt
          if-no-files-found: error
