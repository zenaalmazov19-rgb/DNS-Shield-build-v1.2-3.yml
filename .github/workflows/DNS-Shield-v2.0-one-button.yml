name: DNS Shield APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Создать Android-проект
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/example/dnsshield
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DNS-Shield"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.dnsshield"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.dnsshield"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0"
              }

              signingConfigs {
                  create("release") {
                      storeFile = rootProject.file("dns-shield.keystore")
                      storePassword = "dnsShield123"
                      keyAlias = "dns-shield"
                      keyPassword = "dnsShield123"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="DNS Shield"
                  android:icon="@drawable/ic_shield"
                  android:roundIcon="@drawable/ic_shield"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#06110A</item>
                  <item name="android:navigationBarColor">#06110A</item>
                  <item name="android:colorAccent">#55E68A</item>
                  <item name="android:windowBackground">#06110A</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_shield.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#55E68A"
                  android:pathData="M54,7 L92,22 L92,51 C92,75 76,94 54,101 C32,94 16,75 16,51 L16,22 Z" />
              <path
                  android:fillColor="#06110A"
                  android:pathData="M54,20 L79,30 L79,51 C79,67 69,81 54,87 C39,81 29,67 29,51 L29,30 Z" />
              <path
                  android:fillColor="#55E68A"
                  android:pathData="M48,65 L36,53 L42,47 L48,53 L66,35 L72,41 Z" />
          </vector>
          EOF

          cat > app/src/main/java/com/example/dnsshield/MainActivity.kt <<'EOF'
          package com.example.dnsshield

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private val green = Color.rgb(85, 230, 138)
              private val bg = Color.rgb(6, 17, 10)
              private val card = Color.rgb(16, 31, 22)
              private val text = Color.rgb(242, 247, 244)
              private val muted = Color.rgb(166, 184, 173)

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = Color.rgb(3, 10, 6)
                  window.navigationBarColor = Color.rgb(3, 10, 6)

                  val scroll = ScrollView(this)
                  scroll.setBackgroundColor(bg)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.gravity = Gravity.CENTER_HORIZONTAL
                  root.setPadding(28, 42, 28, 34)
                  scroll.addView(root)

                  val title = TextView(this).apply {
                      text = "DNS Shield"
                      textSize = 32f
                      setTextColor(text)
                      setTypeface(null, Typeface.BOLD)
                      gravity = Gravity.CENTER
                  }
                  root.addView(title, lp(0, 0, 0, 8))

                  val subtitle = TextView(this).apply {
                      text = "Защита DNS без запуска VPN"
                      textSize = 16f
                      setTextColor(green)
                      gravity = Gravity.CENTER
                  }
                  root.addView(subtitle, lp(0, 0, 0, 34))

                  val status = TextView(this).apply {
                      text = "🛡  Готово к включению"
                      textSize = 18f
                      setTextColor(text)
                      setTypeface(null, Typeface.BOLD)
                      gravity = Gravity.CENTER
                      setPadding(18, 22, 18, 22)
                      setBackgroundColor(card)
                  }
                  root.addView(status, lp(0, 0, 0, 26))

                  val enable = Button(this).apply {
                      text = "ВКЛЮЧИТЬ ЗАЩИТУ"
                      textSize = 18f
                      isAllCaps = false
                      setTypeface(null, Typeface.BOLD)
                      setTextColor(Color.rgb(3, 18, 9))
                      setBackgroundColor(green)
                      minHeight = 64
                      setOnClickListener {
                          // Android не разрешает обычному приложению
                          // менять Private DNS полностью без подтверждения пользователя.
                          // Открываем сразу нужный экран, без промежуточных меню.
                          runCatching {
                              startActivity(Intent("android.settings.PRIVATE_DNS_SETTINGS"))
                              Toast.makeText(
                                  this,
                                  "Выберите «Имя хоста провайдера» и сохраните DNS",
                                  Toast.LENGTH_LONG
                              ).show()
                          }.getOrElse {
                              startActivity(Intent(Settings.ACTION_SETTINGS))
                          }
                      }
                  }
                  root.addView(enable, lp(0, 0, 0, 24))

                  val dns = TextView(this).apply {
                      text = "DNS: dns.adguard-dns.com"
                      textSize = 15f
                      setTextColor(green)
                      gravity = Gravity.CENTER
                      setPadding(18, 16, 18, 16)
                      setBackgroundColor(card)
                  }
                  root.addView(dns, lp(0, 0, 0, 22))

                  val note = TextView(this).apply {
                      text = "Одной кнопкой приложение сразу открывает настройки Private DNS. " +
                          "Android не позволяет обычному приложению самостоятельно включить системный Private DNS. " +
                          "Ваш основной VPN не запускается и не отключается."
                      textSize = 14f
                      setTextColor(muted)
                      gravity = Gravity.CENTER
                  }
                  root.addView(note, lp())

                  setContentView(scroll)
              }

              private fun lp(l: Int = 0, t: Int = 0, r: Int = 0, b: Int = 0): LinearLayout.LayoutParams {
                  return LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ).apply {
                      setMargins(l, t, r, b)
                  }
              }
          }
          EOF

      - name: Создать ключ подписи
        shell: bash
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore dns-shield.keystore \
            -storepass dnsShield123 \
            -alias dns-shield \
            -keypass dnsShield123 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=DNS Shield, OU=Mobile, O=DNS Shield, L=Mobile, ST=Mobile, C=US"

      - name: Скачать Gradle
        shell: bash
        run: |
          set -e
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Собрать Release APK
        shell: bash
        run: |
          set -e
          gradle --version
          gradle clean assembleRelease --no-daemon --stacktrace

      - name: Проверить APK
        shell: bash
        run: |
          set -e
          test -f app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: DNS-Shield-v2.0
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
