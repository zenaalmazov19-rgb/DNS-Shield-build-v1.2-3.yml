name: DNS Shield APK v2.9 RELEASE — сохранение истории DNS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Восстановить проверенный проект из v2.2
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          workflow = Path(".github/workflows/DNS-Shield-v2.2.yml")
          if not workflow.exists():
              raise SystemExit("Не найден .github/workflows/DNS-Shield-v2.2.yml")

          data = yaml.safe_load(workflow.read_text(encoding="utf-8"))
          steps = data["jobs"]["build"]["steps"]
          source_step = next(
              (step for step in steps if step.get("name") == "Создать проект на основе v1.4"),
              None
          )
          if not source_step or not source_step.get("run"):
              raise SystemExit("Не найден проверенный шаг создания проекта из v2.2")

          Path("/tmp/create_dns_shield.sh").write_text(source_step["run"], encoding="utf-8")
          print("Найден проверенный шаг создания проекта из v2.2.")
          PY
          bash /tmp/create_dns_shield.sh

      - name: Обновить интерфейс и добавить помощник настройки
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          java = Path("project/app/src/main/java/com/example/dnsshield/MainActivity.java")
          s = java.read_text(encoding="utf-8")
          replacements = {
              'Защита DNS без VPN': 'Защита DNS',
              'Приложение не использует VpnService': 'Работа через Private DNS',
              'Выберите DNS-провайдера и откройте настройки Private DNS. Ваш основной VPN останется включён.': 'Выберите DNS-провайдера и откройте настройки Private DNS. Выбранный хостнейм можно скопировать кнопкой ниже.',
              'Важно: если основной VPN перехватывает DNS-запросы, Private DNS может не применяться. Тогда DNS-блокировку нужно включить в самом VPN.': 'Важно: результат фильтрации зависит от настроек сети и выбранного DNS-провайдера.',
              'Возможно, DNS перехватывает VPN или выбран другой DNS.': 'Проверьте выбранный DNS-провайдер и настройки Private DNS.',
              'Версия 2.2 • без VPN • AdGuard по умолчанию': 'Версия 2.8 • диагностика DNS',
              'Typeface.create("sans", bold ? Typeface.BOLD : Typeface.NORMAL)': 'Typeface.create("sans-serif", bold ? Typeface.BOLD : Typeface.NORMAL)',
              'Typeface.create("sans", Typeface.NORMAL)': 'Typeface.create("sans-serif", Typeface.NORMAL)',
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new)
              else:
                  print("Пропущена отсутствующая строка (другая редакция исходника):", old[:70])
          # Добавить отдельную кнопку-помощник с пошаговой настройкой и подсказками.
          helper_marker = "Button test = new Button(this);"
          helper_button = """                  Button help = new Button(this);
                  help.setText("ПОМОЩЬ С НАСТРОЙКОЙ");
                  help.setTextSize(14);
                  help.setTextColor(Color.rgb(244,255,248));
                  help.setAllCaps(false);
                  help.setBackground(bg(Color.rgb(16,32,25), 18, Color.rgb(37,74,55), 1));
                  root.addView(help, new LinearLayout.LayoutParams(-1, dp(50)));
                  margin(help, 0, 10, 0, 0);
                  help.setOnClickListener(v -> new android.app.AlertDialog.Builder(this)
                      .setTitle("Настройка Private DNS")
                      .setMessage("1. Нажмите «Открыть настройки Private DNS».\\n\\n" +
                          "2. Выберите имя хоста провайдера Private DNS.\\n\\n" +
                          "3. Скопируйте адрес выбранного провайдера в DNS Shield и вставьте его в настройки Android.\\n\\n" +
                          "4. Сохраните настройку. Если интернет пропал, вернитесь в Private DNS и выберите «Автоматически» или «Выкл.».\\n\\n" +
                          "Проверка в приложении — ориентировочная: она не гарантирует блокировку рекламы во всех приложениях. Результат зависит от настроек Android, сети и DNS-провайдера.")
                      .setPositiveButton("Понятно", null)
                      .show());


          """
          if helper_marker not in s:
              raise SystemExit("Не найдено место для добавления помощника рядом с проверкой DNS.")
          s = s.replace(helper_marker, helper_button + helper_marker, 1)

          java.write_text(s, encoding="utf-8")
          print("Интерфейс обновлён: шрифт, формулировки и помощник настройки добавлены.")
          PY

      - name: Исправить светофор DNS и расположение кнопки копирования
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          java = Path("project/app/src/main/java/com/example/dnsshield/MainActivity.java")
          s = java.read_text(encoding="utf-8")

          # Индикатор и результат должны быть полями, чтобы сбрасывать их при выборе DNS.
          class_marker = "public class MainActivity extends Activity {\n"
          fields = "              private TextView statusBadge;\n              private TextView testResult;\n"
          if "private TextView statusBadge;" not in s:
              if class_marker not in s:
                  raise SystemExit("Не найдена декларация MainActivity.")
              s = s.replace(class_marker, class_marker + fields, 1)

          old_badge = 'TextView badge = text("●", 22, Color.rgb(85,227,154), true);'
          if old_badge in s:
              s = s.replace(old_badge, 'statusBadge = text("●", 22, Color.rgb(145,155,150), true);', 1)
          elif 'statusBadge = text("●", 22, Color.rgb(145,155,150), true);' not in s:
              raise SystemExit("Не найден исходный индикатор статуса DNS.")
          s = s.replace('header.addView(badge, new LinearLayout.LayoutParams(dp(28), dp(58)));',
                        'header.addView(statusBadge, new LinearLayout.LayoutParams(dp(28), dp(58)));', 1)

          old_result = 'TextView testResult = tv("Нажмите кнопку для проверки подключения DNS.", 13, Color.rgb(157,176,165));'
          if old_result in s:
              s = s.replace(old_result, 'testResult = tv("Нажмите кнопку для проверки подключения DNS.", 13, Color.rgb(157,176,165));', 1)
          elif 'testResult = tv("Нажмите кнопку для проверки подключения DNS."' not in s:
              raise SystemExit("Не найден начальный текст результата проверки.")

          # Смена провайдера сбрасывает индикатор и старый результат.
          old_click = "card.setOnClickListener(v -> { selected = n; updateSelection(); });"
          new_click = """card.setOnClickListener(v -> {
                      selected = n;
                      updateSelection();
                      if (statusBadge != null) statusBadge.setTextColor(Color.rgb(145,155,150));
                      if (testResult != null) testResult.setText("Выбран DNS: " + hosts[selected] + ". Нажмите «ПРОВЕРИТЬ DNS» для новой проверки.");
                  });"""
          if old_click in s:
              s = s.replace(old_click, new_click, 1)
          elif "Выбран DNS: " not in s:
              raise SystemExit("Не найден обработчик выбора DNS-провайдера.")

          # Кнопка копирования должна находиться после помощника настройки.
          copy_start = s.find("                  Button copy = new Button(this);")
          if copy_start >= 0:
              copy_end_marker = "                  });\n\n"
              copy_end = s.find(copy_end_marker, copy_start)
              if copy_end < 0:
                  raise SystemExit("Не найден конец обработчика кнопки копирования.")
              copy_end += len(copy_end_marker)
              copy_block = s[copy_start:copy_end]
              s = s[:copy_start] + s[copy_end:]
              test_pos = s.find("                  Button test = new Button(this);")
              if test_pos < 0:
                  raise SystemExit("Не найдена кнопка проверки DNS.")
              s = s[:test_pos] + copy_block + s[test_pos:]

          # Проверка сохраняет выбранного в начале провайдера и не выдаёт ложный успех.
          # Не привязываемся к точному количеству пробелов: форматирование
          # исходного Java-кода в разных редакциях может отличаться.
          test_start = s.find("test.setOnClickListener(v -> {")
          selected_host = s.find("selectedHost = tv(")
          if test_start < 0:
              raise SystemExit("Не найден обработчик кнопки проверки DNS.")
          if selected_host < 0:
              raise SystemExit("Не найдено объявление selectedHost после обработчика проверки DNS.")
          test_code = """                  test.setOnClickListener(v -> {
                      final int checkedSelection = selected;
                      test.setEnabled(false);
                      test.setText("Проверяю...");
                      statusBadge.setTextColor(Color.rgb(255,205,70));
                      testResult.setText("Проверяем DNS и выполняем ориентировочный тест фильтрации…");
                      new Thread(() -> {
                          boolean internet = false;
                          boolean blocked = false;
                          try { java.net.InetAddress.getByName("example.com"); internet = true; }
                          catch (Exception ignored) {}
                          try { java.net.InetAddress.getByName("doubleclick.net"); }
                          catch (Exception e) { blocked = true; }
                          final boolean internetOk = internet;
                          final boolean blockedOk = blocked;
                          runOnUiThread(() -> {
                              if (selected != checkedSelection) {
                                  statusBadge.setTextColor(Color.rgb(145,155,150));
                                  testResult.setText("Во время проверки был выбран другой DNS. Запустите проверку ещё раз.");
                              } else if (!internetOk) {
                                  statusBadge.setTextColor(Color.rgb(255,95,95));
                                  testResult.setText("🔴 DNS не отвечает или нет доступа к сети. Проверьте Private DNS и интернет.");
                              } else if (checkedSelection == 2) {
                                  statusBadge.setTextColor(Color.rgb(85,227,154));
                                  testResult.setText("🟢 DNS отвечает.\\nПровайдер: " + hosts[checkedSelection] + "\\nCloudflare Malware фильтрует вредоносные домены, а не рекламу.");
                              } else if (blockedOk) {
                                  statusBadge.setTextColor(Color.rgb(85,227,154));
                                  testResult.setText("🟢 DNS отвечает; тестовый рекламный домен не разрешился. Результат ориентировочный.\\nПровайдер: " + hosts[checkedSelection]);
                              } else {
                                  statusBadge.setTextColor(Color.rgb(255,205,70));
                                  testResult.setText("🟡 DNS отвечает, но блокировка рекламы этим тестом не подтверждена. Это не доказывает, что фильтрация не работает.\\nПровайдер: " + hosts[checkedSelection]);
                              }
                              test.setEnabled(true);
                              test.setText("ПРОВЕРИТЬ DNS");
                          });
                      }).start();
                  });

          """
          s = s[:test_start] + test_code + s[selected_host:]

          # Удалить оставшиеся VPN-упоминания из видимого текста.
          s = s.replace("Возможно, DNS перехватывает VPN или выбран другой DNS.", "Проверьте выбранный DNS-провайдер и настройки Private DNS.")
          java.write_text(s, encoding="utf-8")
          print("Светофор DNS исправлен; кнопка копирования перемещена под помощник настройки.")
          PY

      - name: Добавить постоянное сохранение истории проверок DNS
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          java = Path("project/app/src/main/java/com/example/dnsshield/MainActivity.java")
          s = java.read_text(encoding="utf-8")

          class_marker = "public class MainActivity extends Activity {\n"
          if "private TextView historyView;" not in s:
              if class_marker not in s:
                  raise SystemExit("Не найдена декларация MainActivity для истории.")
              s = s.replace(class_marker, class_marker + "              private TextView historyView;\n", 1)

          if 'TextView historyTitle = text("История проверок"' not in s:
              panel_match = re.search(r"(?m)^[ \t]*root\.addView\(testResult,[^\n]*\);\s*$", s)
              if not panel_match:
                  raise SystemExit("Не найден вызов добавления результата проверки DNS в интерфейс.")
              panel = """
                  TextView historyTitle = text("История проверок", 19, Color.rgb(244,255,248), true);
                  root.addView(historyTitle, new LinearLayout.LayoutParams(-1, -2));
                  margin(historyTitle, 0, 18, 0, 6);
                  historyView = tv(loadHistory(), 13, Color.rgb(157,176,165));
                  root.addView(historyView, new LinearLayout.LayoutParams(-1, -2));
                  margin(historyView, 0, 0, 0, 12);
          """
              insert_at = panel_match.end()
              s = s[:insert_at] + "\n" + panel + s[insert_at:]

          methods = r\'\'\'              private String loadHistory() {
                  String saved = getSharedPreferences("dns_shield_history", MODE_PRIVATE).getString("entries", "");
                  return saved.isEmpty() ? "Пока нет сохранённых проверок." : saved;
              }

              private void addHistory(String entry) {
                  android.content.SharedPreferences prefs = getSharedPreferences("dns_shield_history", MODE_PRIVATE);
                  String old = prefs.getString("entries", "");
                  String stamp = new java.text.SimpleDateFormat("dd.MM HH:mm", java.util.Locale.getDefault()).format(new java.util.Date());
                  String next = stamp + " — " + entry + "\\n" + old;
                  String[] lines = next.split("\\n");
                  StringBuilder limited = new StringBuilder();
                  for (int i = 0; i < lines.length && i < 20; i++) {
                      if (!lines[i].trim().isEmpty()) limited.append(lines[i]).append("\\n");
                  }
                  String result = limited.toString().trim();
                  prefs.edit().putString("entries", result).apply();
                  if (historyView != null) historyView.setText(result.isEmpty() ? "Пока нет сохранённых проверок." : result);
              }

          \'\'\'
          if "private String loadHistory()" not in s:
              # Add methods immediately before MainActivity's final class brace;
              # do not depend on a particular helper method name or indentation.
              class_end = s.rfind("\\n}")
              if class_end < 0:
                  raise SystemExit("Не найден конец класса MainActivity для методов истории.")
              s = s[:class_end] + "\\n" + methods + s[class_end:]

          save_marker = "                              test.setEnabled(true);"
          save_code = r'''                              if (selected == checkedSelection) {
                                  addHistory(hosts[checkedSelection] + " — " + testResult.getText().toString().replace("\\n", " "));
                              }
                              test.setEnabled(true);'''
          if "addHistory(hosts[checkedSelection]" not in s:
              if save_marker not in s:
                  raise SystemExit("Не найден конец обработчика проверки для сохранения результата.")
              s = s.replace(save_marker, save_code, 1)

          java.write_text(s, encoding="utf-8")
          print("История проверок сохраняется в SharedPreferences и ограничена последними 20 результатами.")
          PYCODE

      - name: Обновить номер версии и настроить Release-подпись
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("project/app/build.gradle.kts")
          s = gradle.read_text(encoding="utf-8")
          code_pattern = re.compile(r"(?m)^([ \t]*versionCode[ \t]*=[ \t]*)\d+([ \t]*(?://.*)?$)")
          name_pattern = re.compile(r'(?m)^([ \t]*versionName[ \t]*=[ \t]*)"[^"\n]+"([ \t]*(?://.*)?$)')
          if not code_pattern.search(s):
              raise SystemExit("В app/build.gradle.kts не найдено поле versionCode.")
          if not name_pattern.search(s):
              raise SystemExit("В app/build.gradle.kts не найдено поле versionName.")
          if "signingConfigs {" in s:
              raise SystemExit("Подпись уже настроена; остановка, чтобы не испортить файл.")

          s = code_pattern.sub(r"\g<1>13\g<2>", s, count=1)
          s = name_pattern.sub(r'\g<1>"2.9"\g<2>', s, count=1)
          if not re.search(r'(?m)^\s*versionCode\s*=\s*13\s*$', s) or not re.search(r'(?m)^\s*versionName\s*=\s*"2\.9"\s*$', s):
              raise SystemExit("Не удалось безопасно установить versionCode=13 и versionName=2.9")

          if "    buildTypes {" not in s:
              raise SystemExit("Не найден блок buildTypes в Gradle-файле.")
          signing_block = """    signingConfigs {
                  create("release") {
                      storeFile = file("../dns-shield-release.jks")
                      storePassword = System.getenv("DNS_STORE_PASSWORD")
                          ?: error("Не задан DNS_STORE_PASSWORD")
                      keyAlias = "dns-shield"
                      keyPassword = System.getenv("DNS_KEY_PASSWORD")
                          ?: error("Не задан DNS_KEY_PASSWORD")
                  }
              }

          """
          s = s.replace("    buildTypes {", signing_block + "    buildTypes {", 1)
          if "        release {" not in s:
              raise SystemExit("Не найден блок release внутри buildTypes.")
          s = s.replace("        release {", "        release {\n            signingConfig = signingConfigs.getByName(\"release\")", 1)
          gradle.write_text(s, encoding="utf-8")
          print("Версия 2.9 и конфигурация подписи подготовлены.")
          PY

      - name: Проверить секреты подписи
        shell: bash
        env:
          DNS_RELEASE_KEY_BASE64: ${{ secrets.DNS_RELEASE_KEY_BASE64 }}
          DNS_STORE_PASSWORD: ${{ secrets.DNS_STORE_PASSWORD }}
          DNS_KEY_PASSWORD: ${{ secrets.DNS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DNS_RELEASE_KEY_BASE64" || { echo "Не задан DNS_RELEASE_KEY_BASE64"; exit 1; }
          test -n "$DNS_STORE_PASSWORD" || { echo "Не задан DNS_STORE_PASSWORD"; exit 1; }
          test -n "$DNS_KEY_PASSWORD" || { echo "Не задан DNS_KEY_PASSWORD"; exit 1; }
          echo "Все три секрета подписи заданы."

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Восстановить постоянный ключ подписи
        shell: bash
        env:
          DNS_RELEASE_KEY_BASE64: ${{ secrets.DNS_RELEASE_KEY_BASE64 }}
          DNS_STORE_PASSWORD: ${{ secrets.DNS_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$DNS_RELEASE_KEY_BASE64" | base64 --decode > project/dns-shield-release.jks
          chmod 600 project/dns-shield-release.jks
          keytool -list -keystore project/dns-shield-release.jks \
            -storepass "$DNS_STORE_PASSWORD" -alias dns-shield >/dev/null
          echo "Постоянный ключ подписи восстановлен и проверен."

      - name: Проверить Android SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          fi

      - name: Установить Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Собрать подписанный Release APK
        working-directory: project
        shell: bash
        env:
          DNS_STORE_PASSWORD: ${{ secrets.DNS_STORE_PASSWORD }}
          DNS_KEY_PASSWORD: ${{ secrets.DNS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle clean assembleRelease --no-daemon --stacktrace

      - name: Проверить подпись APK
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "Подпись Release APK проверена."

      - name: Подготовить APK
        shell: bash
        run: |
          set -euo pipefail
          cp project/app/build/outputs/apk/release/app-release.apk DNS-Shield-v2.9-release.apk
          ls -lh DNS-Shield-v2.9-release.apk

      - name: Загрузить Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DNS-Shield-v2.9-release
          path: DNS-Shield-v2.9-release.apk
          if-no-files-found: error
