name: DNS Shield APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Создать Android-проект
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/example/dnsshield
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "DNS-Shield"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.dnsshield'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.dnsshield'
                  minSdk 26
                  targetSdk 35
                  versionCode 3
                  versionName '3.0'
              }

              signingConfigs {
                  release {
                      storeFile file('../dns-shield.keystore')
                      storePassword 'dnsShield123'
                      keyAlias 'dns-shield'
                      keyPassword 'dnsShield123'
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:label="DNS Shield"
                  android:icon="@drawable/ic_shield"
                  android:roundIcon="@drawable/ic_shield"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#06110A</item>
                  <item name="android:navigationBarColor">#06110A</item>
                  <item name="android:colorAccent">#55E68A</item>
                  <item name="android:windowBackground">#06110A</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_shield.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#55E68A"
                  android:pathData="M54,7 L92,22 L92,51 C92,75 76,94 54,101 C32,94 16,75 16,51 L16,22 Z" />
              <path
                  android:fillColor="#06110A"
                  android:pathData="M54,20 L79,30 L79,51 C79,67 69,81 54,87 C39,81 29,67 29,51 L29,30 Z" />
              <path
                  android:fillColor="#55E68A"
                  android:pathData="M48,65 L36,53 L42,47 L48,53 L66,35 L72,41 Z" />
          </vector>
          EOF

          cat > app/src/main/java/com/example/dnsshield/MainActivity.java <<'EOF'
          package com.example.dnsshield;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private static final int GREEN = Color.rgb(85, 230, 138);
              private static final int BG = Color.rgb(6, 17, 10);
              private static final int CARD = Color.rgb(16, 31, 22);
              private static final int WHITE = Color.rgb(242, 247, 244);
              private static final int MUTED = Color.rgb(166, 184, 173);

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.rgb(3, 10, 6));
                  getWindow().setNavigationBarColor(Color.rgb(3, 10, 6));

                  ScrollView scroll = new ScrollView(this);
                  scroll.setBackgroundColor(BG);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setPadding(28, 42, 28, 34);
                  scroll.addView(root);

                  TextView title = text("DNS Shield", 32, WHITE, true);
                  title.setGravity(Gravity.CENTER);
                  root.addView(title, params(0, 0, 0, 8));

                  TextView subtitle = text("Защита DNS без запуска VPN", 16, GREEN, false);
                  subtitle.setGravity(Gravity.CENTER);
                  root.addView(subtitle, params(0, 0, 0, 34));

                  TextView status = text("🛡  Готово к включению", 18, WHITE, true);
                  status.setGravity(Gravity.CENTER);
                  status.setPadding(18, 22, 18, 22);
                  status.setBackgroundColor(CARD);
                  root.addView(status, params(0, 0, 0, 26));

                  Button enable = new Button(this);
                  enable.setText("ВКЛЮЧИТЬ ЗАЩИТУ");
                  enable.setTextSize(18);
                  enable.setAllCaps(false);
                  enable.setTypeface(null, Typeface.BOLD);
                  enable.setTextColor(Color.rgb(3, 18, 9));
                  enable.setBackgroundColor(GREEN);
                  enable.setMinHeight(64);
                  enable.setOnClickListener(v -> openPrivateDns());
                  root.addView(enable, params(0, 0, 0, 24));

                  TextView dns = text("DNS: dns.adguard-dns.com", 15, GREEN, false);
                  dns.setGravity(Gravity.CENTER);
                  dns.setPadding(18, 16, 18, 16);
                  dns.setBackgroundColor(CARD);
                  root.addView(dns, params(0, 0, 0, 22));

                  TextView note = text(
                      "Нажмите кнопку — приложение сразу откроет экран Private DNS. " +
                      "Android не разрешает обычному приложению самостоятельно менять системный Private DNS. " +
                      "Ваш основной VPN не запускается и не отключается.",
                      14, MUTED, false
                  );
                  note.setGravity(Gravity.CENTER);
                  root.addView(note, params(0, 0, 0, 0));

                  setContentView(scroll);
              }

              private void openPrivateDns() {
                  try {
                      startActivity(new Intent("android.settings.PRIVATE_DNS_SETTINGS"));
                      Toast.makeText(
                          this,
                          "Выберите «Имя хоста провайдера» и сохраните DNS",
                          Toast.LENGTH_LONG
                      ).show();
                  } catch (Exception e) {
                      startActivity(new Intent(Settings.ACTION_SETTINGS));
                  }
              }

              private TextView text(String value, int size, int color, boolean bold) {
                  TextView v = new TextView(this);
                  v.setText(value);
                  v.setTextSize(size);
                  v.setTextColor(color);
                  if (bold) {
                      v.setTypeface(null, Typeface.BOLD);
                  }
                  return v;
              }

              private LinearLayout.LayoutParams params(int l, int t, int r, int b) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  );
                  p.setMargins(l, t, r, b);
                  return p;
              }
          }
          EOF

      - name: Создать ключ подписи
        shell: bash
        run: |
          set -e
          keytool -genkeypair -v \
            -keystore dns-shield.keystore \
            -storepass dnsShield123 \
            -alias dns-shield \
            -keypass dnsShield123 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=DNS Shield, OU=Mobile, O=DNS Shield, L=Mobile, ST=Mobile, C=US"

      - name: Скачать Gradle
        shell: bash
        run: |
          set -e
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Собрать Release APK
        shell: bash
        run: |
          set -e
          gradle --version
          gradle clean assembleRelease --no-daemon --stacktrace

      - name: Проверить APK
        shell: bash
        run: |
          set -e
          test -f app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: DNS-Shield-v3.0
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
