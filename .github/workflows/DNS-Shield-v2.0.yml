name: DNS Shield APK v2.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Создать проект из рабочей версии v1.4
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          source = Path(".github/workflows/DNS-Shield-build-v1.4.yml").read_text()

          files = re.findall(
              r"cat > ([^ ]+) <<'EOF'\n(.*?)\nEOF",
              source,
              re.S
          )

          if not files:
              raise SystemExit("Не удалось найти исходники v1.4")

          for name, content in files:
              p = Path(name)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding="utf-8")

          print("Исходники v1.4 восстановлены")
          PY

      - name: Обновить приложение до версии 2.0
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          gradle = Path("project/app/build.gradle.kts")
          s = gradle.read_text()

          s = s.replace('versionCode = 2', 'versionCode = 4')
          s = s.replace('versionName = "1.4"', 'versionName = "2.0"')

          gradle.write_text(s)

          p = Path(
              "project/app/src/main/java/com/example/dnsshield/MainActivity.java"
          )

          s = p.read_text()

          marker = 'selectedHost = tv("", 13, Color.rgb(157,176,165));'

          button = r'''
                  Button updateButton = new Button(this);
                  updateButton.setText("ПРОВЕРИТЬ ОБНОВЛЕНИЕ");
                  updateButton.setTextSize(15);
                  updateButton.setAllCaps(false);
                  updateButton.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  updateButton.setTextColor(Color.rgb(85,227,154));
                  updateButton.setBackground(
                      bg(Color.rgb(16,32,25),18,Color.rgb(85,227,154),1)
                  );

                  root.addView(
                      updateButton,
                      new LinearLayout.LayoutParams(-1,dp(54))
                  );

                  margin(updateButton,0,10,0,0);

                  updateButton.setOnClickListener(v -> {
                      try {
                          Intent intent = new Intent(
                              Intent.ACTION_VIEW,
                              Uri.parse("https://apps.rustore.ru/")
                          );
                          startActivity(intent);
                      } catch(Exception ignored) {}
                  });

          '''

          if marker not in s:
              raise SystemExit("Не найдено место для кнопки обновления")

          s = s.replace(marker, button + marker, 1)

          p.write_text(s)

          print("Версия 2.0 и кнопка обновления добавлены")
          PY

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Проверить Android SDK
        shell: bash
        run: |
          set -e

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            "$SDKMANAGER" \
              "platforms;android-35" \
              "build-tools;35.0.0" \
              "platform-tools"
          fi

      - name: Установить Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Собрать APK
        working-directory: project
        shell: bash
        run: |
          set -e
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Подготовить APK
        shell: bash
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk DNS-Shield-v2.0.apk
          ls -lh DNS-Shield-v2.0.apk

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: DNS-Shield-v2.0
          path: DNS-Shield-v2.0.apk
          if-no-files-found: error
