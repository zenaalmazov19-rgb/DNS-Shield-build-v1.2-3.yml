name: DNS Shield APK v2.0

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Создать проект на основе v1.4
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import urllib.request

          url = "https://raw.githubusercontent.com/zenaalmazov19-rgb/DNS-Shield-build-v1.2-3.yml/main/.github/workflows/DNS-Shield-build-v1.4.yml"
          src = urllib.request.urlopen(url).read().decode("utf-8")
          lines = src.splitlines()

          name_i = next(i for i, line in enumerate(lines)
                        if line.strip() == "- name: Создать Android-проект DNS Shield")
          run_i = next(i for i in range(name_i, len(lines))
                       if lines[i].strip() == "run: |")
          end_i = next(i for i in range(run_i + 1, len(lines))
                       if lines[i].startswith("      - name:"))

          block = []
          for line in lines[run_i + 1:end_i]:
              block.append(line[10:] if line.startswith("          ") else line)

          Path("/tmp/create_v14.sh").write_text("\n".join(block) + "\n", encoding="utf-8")
          print("Исходный скрипт v1.4 найден.")
          PY
          bash /tmp/create_v14.sh

      - name: Обновить приложение до версии 2.0
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("project/app/build.gradle.kts")
          s = gradle.read_text()
          s = s.replace("versionCode = 2", "versionCode = 4")
          s = s.replace('versionName = "1.4"', 'versionName = "2.0"')
          gradle.write_text(s)

          java = Path("project/app/src/main/java/com/example/dnsshield/MainActivity.java")
          s = java.read_text()
          marker = 'selectedHost = tv("", 13, Color.rgb(157,176,165));'

          button = '''
                  Button updateButton = new Button(this);
                  updateButton.setText("ПРОВЕРИТЬ ОБНОВЛЕНИЕ");
                  updateButton.setTextSize(15);
                  updateButton.setAllCaps(false);
                  updateButton.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  updateButton.setTextColor(Color.rgb(85,227,154));
                  updateButton.setBackground(bg(Color.rgb(16,32,25),18,Color.rgb(85,227,154),1));
                  root.addView(updateButton, new LinearLayout.LayoutParams(-1, dp(54)));
                  margin(updateButton, 0, 10, 0, 0);
                  updateButton.setOnClickListener(v -> {
                      try {
                          startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse("https://apps.rustore.ru/")));
                      } catch(Exception ignored) {}
                  });

          '''

          if marker not in s:
              raise SystemExit("Не найдено место для кнопки обновления")

          s = s.replace(marker, button + marker, 1)
          java.write_text(s)
          PY

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Проверить Android SDK
        shell: bash
        run: |
          set -e
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          fi

      - name: Установить Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Собрать APK
        working-directory: project
        run: gradle clean assembleDebug --no-daemon --stacktrace

      - name: Подготовить APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk DNS-Shield-v2.0.apk

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: DNS-Shield-v2.0
          path: DNS-Shield-v2.0.apk
          if-no-files-found: error
